<meta name="twitter:description" content="App Android que lê a notificação do banco, anota seus gastos e avisa antes de estourar o teto. Sem anúncios, sem login e funciona sem internet.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap"><style>
/* Layout: uma coluna de leitura com faixas largas; o herói mostra a notificação virando lançamento, e a régua vermelho→verde costura a página. */
:root{
  --bg:#F3F7F0; --card:#FFFFFF; --ink:#11281A; --muted:#4D5C4F; --line:#D4DECF;
  --leaf:#2E7D32; --sprout:#6DB33F; --deep:#123B1C; --on-deep:#E8F3E3;
  --red:#C2372C; --amber:#D99A12;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s1:.8125rem; --s2:1rem; --s3:1.1875rem; --s4:1.5rem; --s5:2.25rem; --s6:clamp(2.6rem,7vw,4.6rem);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C130E; --card:#152018; --ink:#E3ECE0; --muted:#A1B19F; --line:#26352A;
  --leaf:#73C178; --sprout:#9AD861; --deep:#0F2A16; --on-deep:#DDEED7;
  --red:#F0695D; --amber:#F0BF4C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C130E; --card:#152018; --ink:#E3ECE0; --muted:#A1B19F; --line:#26352A;
  --leaf:#73C178; --sprout:#9AD861; --deep:#0F2A16; --on-deep:#DDEED7;
  --red:#F0695D; --amber:#F0BF4C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s2);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:var(--s5);font-weight:800}
h3{font-size:var(--s3);font-weight:700}
p{margin:0}
a{color:var(--leaf)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sprout);outline-offset:3px;border-radius:6px}
.eyebrow{font-family:var(--f-mono);font-size:var(--s1);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
section{padding-block:clamp(56px,9vw,96px)}
.lead{font-size:var(--s3);color:var(--muted);max-width:60ch}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--ink);text-decoration:none}
.logo .go{color:var(--ink)}.logo .gr{color:var(--leaf)}
.logo svg{width:34px;height:34px}
.top nav{display:flex;gap:20px;font-weight:500}
.top nav a{color:var(--muted);text-decoration:none}
.top nav a:hover{color:var(--ink)}
@media (max-width:620px){.top nav .opt{display:none}}

/* herói */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,64px);align-items:center;padding-block:clamp(24px,5vw,56px) clamp(56px,8vw,88px)}
.hero>*{min-width:0}
.hero h1{font-size:var(--s6);font-weight:800}
.strike{position:relative;color:var(--red);white-space:nowrap}
.strike::after{content:"";position:absolute;left:-2%;right:-2%;top:55%;height:.09em;background:var(--red);transform:rotate(-4deg);border-radius:4px}
.green{color:var(--leaf)}
.red{color:var(--red)}
.hero .lead{margin-top:22px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:600;text-decoration:none;font-size:var(--s2);border:0;cursor:pointer;font-family:inherit}
.btn-main{background:var(--leaf);color:var(--bg)}
.btn-main:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.small{font-size:var(--s1);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:var(--s1);color:var(--muted)}
.tags span::before{content:"✓ ";color:var(--leaf);font-weight:700}

.phone{justify-self:center;width:min(330px,100%);aspect-ratio:9/17;max-width:100%;background:var(--deep);border-radius:38px;padding:16px 14px;box-shadow:0 30px 60px -30px rgba(10,40,18,.45);display:flex;flex-direction:column;gap:14px;position:relative}
.phone .bar{display:flex;justify-content:space-between;color:var(--on-deep);opacity:.7;font-family:var(--f-mono);font-size:.72rem;padding:4px 10px 0}
.notif{background:rgba(255,255,255,.1);color:var(--on-deep);border-radius:18px;padding:12px 14px;font-size:.82rem;line-height:1.4}
.notif b{display:block;font-size:.76rem;opacity:.75;font-weight:600;margin-bottom:2px}
.arrow{align-self:center;color:var(--sprout);font-family:var(--f-mono);font-size:.72rem;display:flex;align-items:center;gap:6px}
.entry{background:var(--card);color:var(--ink);border-radius:18px;padding:14px;display:grid;gap:10px}
.entry .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.entry .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.05rem}
.chip{font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--sprout) 22%,transparent);color:var(--leaf)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:68%;background:var(--leaf);border-radius:99px;animation:fill 1.6s cubic-bezier(.2,.8,.2,1) both .4s}
@keyframes fill{from{width:41%}to{width:68%}}
.entry .small{font-size:.74rem}
.toast{margin-top:auto;background:rgba(255,255,255,.08);color:var(--on-deep);border-radius:14px;padding:10px 12px;font-size:.76rem;display:flex;gap:8px;align-items:center}
.toast em{font-style:normal;color:var(--sprout);font-weight:600}
@media (max-width:820px){.hero{grid-template-columns:1fr}.phone{aspect-ratio:auto}}

/* régua */
.ruler{background:var(--card);border-block:1px solid var(--line)}
.ruler .wrap{padding-block:30px;display:grid;gap:14px}
.scale{display:grid;grid-template-columns:90fr 10fr 18fr;height:14px;border-radius:99px;overflow:hidden}
.scale i:nth-child(1){background:var(--leaf)}.scale i:nth-child(2){background:var(--amber)}.scale i:nth-child(3){background:var(--red)}
.scale-legend{display:grid;grid-template-columns:90fr 10fr 18fr;font-family:var(--f-mono);font-size:var(--s1);color:var(--muted);font-variant-numeric:tabular-nums}
.scale-legend span:nth-child(2){text-align:center}.scale-legend span:nth-child(3){text-align:right}
.ruler p{max-width:70ch;color:var(--muted)}
.ruler p strong{color:var(--ink)}

/* passos */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:40px;counter-reset:passo}
.step{display:grid;gap:10px;align-content:start;min-width:0}
.step::before{counter-increment:passo;content:counter(passo);font-family:var(--f-display);font-weight:800;font-size:2.4rem;color:var(--sprout);line-height:1}
.step p{color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* privacidade */
.deep{background:var(--deep);color:var(--on-deep)}
.deep .eyebrow{color:var(--sprout)}
.deep .lead{color:color-mix(in srgb,var(--on-deep) 78%,transparent)}
.priv{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 40px;margin-top:36px}
.priv div{border-top:1px solid color-mix(in srgb,var(--on-deep) 22%,transparent);padding-top:16px;min-width:0}
.priv p{color:color-mix(in srgb,var(--on-deep) 78%,transparent);margin-top:6px}
@media (max-width:640px){.priv{grid-template-columns:1fr}}

/* jogo */
.game{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:start;margin-top:36px}
.game>*{min-width:0}
.levels{display:grid;gap:12px}
.lv{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.lv .ic{font-size:1.6rem;text-align:center}
.lv p{color:var(--muted);font-size:.92rem}
.lv .xp{font-family:var(--f-mono);font-size:var(--s1);color:var(--leaf);font-variant-numeric:tabular-nums}
.feat{display:grid;gap:18px}
.feat p{color:var(--muted)}
@media (max-width:760px){.game{grid-template-columns:1fr}}

/* preços */
.plans{overflow-x:auto;margin-top:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-display);font-size:var(--s3)}
td:nth-child(3),th:nth-child(3){background:color-mix(in srgb,var(--sprout) 9%,transparent)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.price{padding:18px;border:1px solid var(--line);border-radius:var(--r);display:grid;gap:4px;min-width:0}
.price.best{border-color:var(--leaf);border-width:2px}
.price .v{font-family:var(--f-display);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums}
.price p{color:var(--muted);font-size:.92rem}
@media (max-width:700px){.prices{grid-template-columns:1fr}}

/* convite */
.invite{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding:28px;border-radius:var(--r);background:var(--card);border:1px dashed var(--leaf)}
.invite>div{min-width:0;flex:1 1 320px}
.code{font-family:var(--f-mono);font-size:1.3rem;letter-spacing:.12em;padding:10px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}

/* faq */
.faq{display:grid;gap:10px;margin-top:32px;max-width:760px}
details{border-bottom:1px solid var(--line);padding-block:14px}
summary{cursor:pointer;font-weight:600;font-size:var(--s3);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";color:var(--leaf);font-family:var(--f-mono)}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:10px;max-width:65ch}

/* política */
.policy{max-width:760px}
.policy h3{margin-top:28px}
.policy p,.policy li{color:var(--muted)}
.policy p{margin-top:10px}
.policy ul{padding-left:20px;margin:10px 0 0}

footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:28px;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;color:var(--muted);font-size:var(--s1)}


.play-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:14px;background:var(--deep);color:var(--on-deep);text-decoration:none;font-weight:600;line-height:1.15}
.play-pill svg{width:22px;height:22px;flex:none}
.play-pill small{display:block;font-size:.72rem;font-weight:500;opacity:.8;letter-spacing:.02em}
a.play-pill:hover{filter:brightness(1.12)}
.baixar{text-align:center}
.baixar .lead{margin:14px auto 0}
.baixar .ctas{justify-content:center}

/* carrosséis */
.car{position:relative;margin-top:28px}
.car-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/3);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;list-style:none;padding:0 0 6px;margin:0;scrollbar-width:none;overscroll-behavior-x:contain}
.car-track::-webkit-scrollbar{display:none}
.car-card{scroll-snap-align:start;min-width:0}
.car-card img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
.car-btn.prev{left:-14px}.car-btn.next{right:-14px}
.car-btn[disabled]{opacity:.35;cursor:default}
.car-dots{display:flex;justify-content:center;gap:8px;margin-top:16px}
.car-dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.car-dots button[aria-current="true"]{background:var(--leaf);width:22px;border-radius:99px}
@media (max-width:760px){.car-track{grid-auto-columns:80%}.car-btn{display:none}}
/* vacinas */
.vac{background:var(--card);border-block:1px solid var(--line)}
.vac ul{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.vac li{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--muted);min-width:0}
.vac li strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:var(--s3);margin-bottom:2px}
@media (max-width:700px){.vac ul{grid-template-columns:1fr}}
/* Verdi */
.verdi-grid{display:grid;grid-template-columns:240px 1fr;gap:clamp(24px,5vw,56px);align-items:center}
.verdi-grid>*{min-width:0}
.verdi-grid img{width:100%;height:auto;display:block;background:color-mix(in srgb,var(--on-deep) 8%,transparent);border-radius:24px;padding:18px 10px 0}
@media (max-width:700px){.verdi-grid{grid-template-columns:1fr}.verdi-grid img{max-width:200px;margin:0 auto}}

@media (prefers-reduced-motion: reduce){.meter i{animation:none}}
</style>

</head><body>
<main class="wrap" style="min-height:80vh;display:grid;place-content:center;text-align:center;gap:18px">
<img src="/img/verdi.svg" width="150" height="210" alt="" style="margin:0 auto">
<h1 style="font-size:var(--s5)">Ops, essa página não existe.</h1>
<p class="lead" style="margin:0 auto">Mas o caminho para o verde continua aqui.</p>
<p><a class="btn btn-main" href="/">Voltar para o início</a></p>
</main></body></html>
